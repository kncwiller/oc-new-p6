name: oc-new-p6-ci
run-name: ${{ github.actor }} a lancé le workflow CI/CD pour le projet oc-new-p6

on:
  push:
    branches: [ "main", "master", "feature/**", "hotfix/**" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: exécute le script de tests unitaires sur toutes les applications
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tests
        run: chmod +x run-tests.sh && ./run-tests.sh

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always() # Toujours exécuter même si les tests échouent
        with:
          name: test-results
          path: test-results/

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always() # Toujours exécuter même si les tests échouent
        with:
          files: "test-results/*.xml"

  release:
    name: Create releases
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      frontend_published: ${{ steps.release_front.outputs.new_release_published }}
      frontend_version: ${{ steps.release_front.outputs.new_release_version }}
      backend_published: ${{ steps.release_back.outputs.new_release_published }}
      backend_version: ${{ steps.release_back.outputs.new_release_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install semantic release dependencies
        working-directory: ./workshop-organizer
        run: npm install

      - name: Semantic Release Backend
        id: release_back
        working-directory: ./workshop-organizer
        run: |
          chmod +x ./scripts/update-version.sh
          npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: "github-actions[bot]"

      - name: Install semantic release dependencies frontend
        working-directory: ./oc-p6-front
        run: npm install

      - name: Semantic Release Frontend
        id: release_front
        working-directory: ./oc-p6-front
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: "github-actions[bot]"

  build:
    name: Build & Publish Docker images
    runs-on: ubuntu-latest
    needs: [test, release]
    if: github.ref == 'refs/heads/master' && needs.test.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Frontend Docker tag
        run: |
          if [ "${{ needs.release.outputs.frontend_published }}" == "true" ]; then
            echo "FRONT_DOCKER_TAG=${{ needs.release.outputs.frontend_version }}" >> $GITHUB_ENV
          else
            SAFE_BRANCH=${GITHUB_REF_NAME//\//-}
            echo "FRONT_DOCKER_TAG=${SAFE_BRANCH}-${GITHUB_SHA}" >> $GITHUB_ENV
          fi
          echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./oc-p6-front
          file: ./oc-p6-front/Dockerfile
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/olympic-game-starter:${{ env.FRONT_DOCKER_TAG }}

      - name: Prepare Backend Docker tag
        run: |
          if [ "${{ needs.release.outputs.backend_published }}" == "true" ]; then
            echo "BACK_DOCKER_TAG=${{ needs.release.outputs.backend_version }}" >> $GITHUB_ENV
          else
            SAFE_BRANCH=${GITHUB_REF_NAME//\//-}
            echo "BACK_DOCKER_TAG=${SAFE_BRANCH}-${GITHUB_SHA}" >> $GITHUB_ENV
          fi

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./workshop-organizer
          file: ./workshop-organizer/Dockerfile
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/workshop-organizer:${{ env.BACK_DOCKER_TAG }}
