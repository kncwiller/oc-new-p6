services:

  app:
    build: .
    image: workshop-organizer
    container_name: workshop-organizer-container
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://db:5432/workshopsdb"
      SPRING_DATASOURCE_USERNAME: workshops_user
      SPRING_DATASOURCE_PASSWORD: oc2024
    restart: unless-stopped

  db:
    image: postgres:13
    container_name: db
    networks:
      - default
    environment:
      POSTGRES_USER: workshops_user
      POSTGRES_PASSWORD: oc2024
      POSTGRES_DB: workshopsdb
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - local_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workshops_user -d workshopsdb"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  default:
    name: workshop-organizer-network

volumes:
  local_pgdata: